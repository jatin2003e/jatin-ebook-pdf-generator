{% extends 'base.html' %}{% block content %}<h1>Ebook builder</h1><form method="post" class="card"><input name="title" placeholder="Book title" required><input name="author" placeholder="Author"><label>Chapters (separate with a blank line; first line is chapter heading)</label><textarea name="chapters" rows="14" required placeholder="Chapter 1: Introduction&#10;Your text here...&#10;&#10;Chapter 2: Next steps&#10;More text..."></textarea><button>Save ebook</button></form><h2>Library</h2>{% for b in books %}<p>{{b.title}} — <a href="/export/{{b.id}}">Download PDF</a></p>{% endfor %}{% endblock %}
